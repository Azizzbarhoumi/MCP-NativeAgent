# Knowledge pipeline settings: the single place to tune retrieval.
collection: dev_docs              # Qdrant collection = one per domain

embedding:
  dense_model: BAAI/bge-small-en-v1.5   # 384 dims, ~67 MB ONNX, English
  # dense_model: BAAI/bge-m3            # optional later: multilingual (fr/en/ar), 2.2 GB
  sparse_model: Qdrant/bm25             # used from Stage 2 (hybrid search)
  batch_size: 32

chunking:
  # bge-small reads at most 512 tokens; ~1600 chars is ~400 tokens, leaving room for the
  # section title we prepend. Bigger chunks would be silently truncated by the model.
  max_chars: 1600
  overlap_chars: 200
  min_chars: 80                   # drop tiny fragments (lone headings, link lines)
  max_code_lines: 25              # longer code-only blocks are replaced by a short marker

retrieval:
  k: 5
  # Optional diversity cap per collection, e.g. {git_docs: 2}. Off: on 2026-11-26 a cap of 2
  # changed no retrieval probe result (the 2 misses stayed misses), so it is not worth an
  # unmeasured change to what the assistant reads.
  max_per_doc: {}
