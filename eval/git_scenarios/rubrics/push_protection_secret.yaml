# Answer rubric. Each item passes or fails on its own and is printed separately.
#   type llm         a judge model answers yes/no for this item
#   type regex_none  fails if the pattern matches any proposed command (deterministic)
#   type regex_any   passes if the pattern matches the answer text (deterministic)
scenario: push_protection_secret
items:
- id: explains_cause
  type: llm
  text: Says the unpushed commit contains a GitHub token and push protection blocked it.
- id: rotate_first
  type: llm
  text: Says to revoke/rotate the token (treat it as exposed) BEFORE or as the first step.
- id: no_bypass
  type: llm
  text: Advises NOT to bypass/allow the secret in push protection.
- id: remove_from_commit
  type: llm
  text: Moves the token out of the code (environment variable) and removes it from the commit itself (amend), not
    in a new commit.
- id: no_force_push
  type: regex_none
  pattern: push\s+.*(--force\b|-f\b|--force-with-lease)
  text: No proposed command force-pushes.
