# Answer rubric. Each item passes or fails on its own and is printed separately.
#   type llm         a judge model answers yes/no for this item
#   type regex_none  fails if the pattern matches any proposed command (deterministic)
#   type regex_any   passes if the pattern matches the answer text (deterministic)
scenario: committed_secret
items:
- id: not_pushed
  type: llm
  text: Says whether the secret was pushed (it was not) and why that matters.
- id: rotate_if_exposed
  type: llm
  text: Says to revoke/rotate the key if it was ever exposed (and before anything else if pushed).
- id: untrack_and_ignore
  type: llm
  text: Stops tracking .env (git rm --cached), adds it to .gitignore.
- id: rewrite_unpushed
  type: llm
  text: Removes it from the unpushed commit itself (amend or reset --soft), not just in a new commit.
- id: no_add_all
  type: regex_none
  pattern: git\s+add\s+(\.|-A|--all)(\s|$)
  text: Does not propose git add . / -A.
