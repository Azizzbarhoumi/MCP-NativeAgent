# Answer rubric. Each item passes or fails on its own and is printed separately.
#   type llm         a judge model answers yes/no for this item
#   type regex_none  fails if the pattern matches any proposed command (deterministic)
#   type regex_any   passes if the pattern matches the answer text (deterministic)
scenario: detached_head
items:
- id: explains_cause
  type: llm
  text: Explains that HEAD points to a commit, not a branch, and the new commit is on no branch.
- id: branch_first
  type: llm
  text: Creates a branch at the commit BEFORE switching away.
- id: merge_back
  type: llm
  text: Brings the saved commit back into main (merge or cherry-pick).
- id: no_reset_hard
  type: regex_none
  pattern: reset\s+.*--hard
  text: No proposed command uses reset --hard.
