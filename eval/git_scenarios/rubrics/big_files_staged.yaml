# Answer rubric. Each item passes or fails on its own and is printed separately.
#   type llm         a judge model answers yes/no for this item
#   type regex_none  fails if the pattern matches any proposed command (deterministic)
#   type regex_any   passes if the pattern matches the answer text (deterministic)
scenario: big_files_staged
items:
- id: explains_cause
  type: llm
  text: Says git add . staged generated folders and nothing is committed yet.
- id: unstage
  type: llm
  text: Unstages them (git restore --staged or git rm -r --cached) while keeping the files on disk.
- id: gitignore
  type: llm
  text: Adds node_modules/ and build/ to .gitignore.
- id: keeps_app_change
  type: llm
  text: Keeps the app.py change and commits only what the user wanted.
- id: no_reset_hard
  type: regex_none
  pattern: reset\s+.*--hard
  text: No proposed command uses reset --hard.
- id: no_clean
  type: regex_none
  pattern: clean\s+-\w*f|rm\s+-rf
  text: Never deletes files (clean -f / rm -rf).
