# docker-compose.yml: starts the infrastructure the agents depend on.
# Run: docker compose up -d     Stop: docker compose down
# Data lives in named volumes, so it survives restarts.

services:
  # Vector database: stores embeddings for RAG, the tool router and long-term memory.
  qdrant:
    image: qdrant/qdrant:v1.20.2   # match qdrant-client 1.20 (client/server must be within 1 minor version)
    ports:
      - "6333:6333"   # REST API + web dashboard at http://localhost:6333/dashboard
    volumes:
      - qdrant_data:/qdrant/storage

  # Graph database: stores entities and relations for GraphRAG.
  neo4j:
    image: neo4j:5.24-community
    ports:
      - "7474:7474"   # browser UI at http://localhost:7474
      - "7687:7687"   # bolt protocol, used by the Python driver
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me-please}
    volumes:
      - neo4j_data:/data

  # Postgres: Langfuse's own database (not used by our agents directly).
  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db:/var/lib/postgresql/data

  # Tracing UI: every LLM and tool call shows up here, tagged with task_id.
  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      - langfuse-db
    ports:
      - "3000:3000"   # web UI at http://localhost:3000
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-dev-secret-change-me
      SALT: local-dev-salt-change-me

volumes:
  qdrant_data:
  neo4j_data:
  langfuse_db:
